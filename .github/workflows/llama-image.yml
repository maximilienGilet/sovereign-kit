name: Publish llama CUDA image
on:
  workflow_dispatch:
    inputs:
      ssh_patch:
        description: Reuse the pinned published runtime and only patch SSH startup
        type: boolean
        default: false
  push:
    branches: [feat/prebuilt-llama-runtime]
    paths: [server/llama/**, .github/workflows/llama-image.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: llama-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact public source
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
      - name: Build and check image
        env:
          IMAGE: ghcr.io/maximiliengilet/sovereign-kit-llama
          SOURCE_SHA: ${{ github.sha }}
          SSH_PATCH: ${{ inputs.ssh_patch }}
        run: |
          dockerfile=server/llama/Dockerfile
          if [[ "$SSH_PATCH" == true ]]; then dockerfile=server/llama/Dockerfile.ssh-fix; fi
          docker build -f "$dockerfile" --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "$IMAGE:$SOURCE_SHA" server/llama
          docker run --rm --entrypoint python3 "$IMAGE:$SOURCE_SHA" /opt/sovereign-kit/llama/smoke.py --cpu-only
          first=$(docker run --rm "$IMAGE:$SOURCE_SHA" ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | tail -n 1 | awk '{print $2}')
          second=$(docker run --rm "$IMAGE:$SOURCE_SHA" ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | tail -n 1 | awk '{print $2}')
          [[ "$first" == SHA256:* && "$second" == SHA256:* && "$first" != "$second" ]]
          # Exercise the actual failure mode: Vast bypasses our ENTRYPOINT.
          first=$(docker run --rm --network none --entrypoint python3 --mount "type=bind,src=$PWD/server/llama/test_ssh_startup.py,dst=/tmp/test_ssh_startup.py,readonly" "$IMAGE:$SOURCE_SHA" /tmp/test_ssh_startup.py)
          second=$(docker run --rm --network none --entrypoint python3 --mount "type=bind,src=$PWD/server/llama/test_ssh_startup.py,dst=/tmp/test_ssh_startup.py,readonly" "$IMAGE:$SOURCE_SHA" /tmp/test_ssh_startup.py)
          [[ "$first" == SHA256:* && "$second" == SHA256:* && "$first" != "$second" ]]
      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/maximiliengilet/sovereign-kit-llama
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$SOURCE_SHA"
          docker logout ghcr.io
